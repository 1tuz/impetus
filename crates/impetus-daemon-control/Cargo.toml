[package]
name = "impetus-daemon-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared local impetusd lifecycle: probe, spawn lock, stale recovery, readiness"
repository.workspace = true

[dependencies]
impetus-client = { path = "../impetus-client" }
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.15"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
