[package]
name = "impetus-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Embedded/test harness that drives `Harness` in-process. Unix socket path does
# not need this.
in-memory = ["dep:impetus-core"]

[dependencies]
impetus-protocol = { path = "../impetus-protocol" }
impetus-core = { path = "../impetus-core", optional = true }
anyhow.workspace = true
base64 = "0.23.1"
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
impetus-core = { path = "../impetus-core" }
tempfile = "3.15"
