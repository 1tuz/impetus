[workspace]
members = [
  "crates/impetus-core",
  "crates/agentic-terminal-app",
  "crates/impetus",
  "crates/agentic-terminal-cli",
  "crates/agentic-terminal-client", "crates/agentic-terminal-zap-adapter", "crates/agentic-terminal-acp-gateway",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Local developer"]
repository = "https://github.com/1tuz/orbit"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0.100"
futures-util = "0.3.31"
humantime-serde = "1.1.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "default-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.27"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
