version: '3'

set: [errexit, nounset, pipefail]

tasks:
  default:
    desc: Показать доступные команды
    cmds:
      - task --list

  setup:
    desc: Проверить macOS/Xcode/Metal/Rust и подключить Git hooks
    cmds:
      - ./scripts/bootstrap-macos.sh
      - |
        if git rev-parse --git-dir >/dev/null 2>&1; then
          git config core.hooksPath .githooks
          echo 'Git hooks подключены из .githooks/'
        fi

  fmt:
    desc: Проверить форматирование Rust
    cmds:
      - cargo fmt --all -- --check

  diff:check:
    desc: Проверить whitespace/conflict markers в diff
    cmds:
      - git diff --check

  test:
    desc: 'Полный unit-suite (опционально; качество — на GitHub Actions)'
    cmds:
      - cargo test --workspace

  check:
    desc: 'Полный cargo check (опционально; качество — на GitHub Actions)'
    cmds:
      - cargo check --workspace

  lint:
    desc: 'Полный Clippy (опционально; качество — на GitHub Actions)'
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  verify:
    desc: 'Дешёвый локальный gate перед push (тяжёлое — на CI)'
    cmds:
      - task: fmt
      - task: diff:check

  verify:full:
    desc: 'Локальный полный workspace suite (редко; обычно не нужен)'
    cmds:
      - task: fmt
      - task: test
      - task: check
      - task: lint

  bench:
    desc: Local event-log Criterion benches (not a PR CI gate)
    cmds:
      - cargo bench -p impetus-core --bench event_log

  daemon:
    desc: Запустить impetusd (authoritative daemon) в текущей terminal tab
    cmds:
      - cargo run -p impetusd

  harness:
    desc: 'DEPRECATED: используй task daemon'
    cmds:
      - task: daemon

  client:
    desc: 'Вызвать impetus client CLI; пример: task client -- create'
    cmds:
      - cargo run -p impetus -- {{.CLI_ARGS}}

  cli:
    desc: 'DEPRECATED: используй task client'
    cmds:
      - task: client

  ci:affected:
    desc: Показать CI scope для текущей ветки vs origin/main
    cmds:
      - chmod +x scripts/ci-affected.sh
      - BASE_REF=origin/main ./scripts/ci-affected.sh

  security:audit:
    desc: Проверить Cargo.lock по RustSec advisories
    cmds:
      - cargo audit

  security:deny:
    desc: Проверить advisories, лицензии, bans и sources Cargo dependency graph
    cmds:
      - cargo deny check advisories bans sources licenses

  security:
    desc: Выполнить все dependency security checks
    cmds:
      - task: security:audit
      - task: security:deny

  commit:check:
    desc: 'Проверить Git subject (KEY-123 type: Результат)'
    requires:
      vars: [MESSAGE]
    env:
      COMMIT_SUBJECT: '{{.MESSAGE}}'
    cmds:
      - python3 scripts/check-commit-subject.py
