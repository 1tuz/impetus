version: '3'

set: [errexit, nounset, pipefail]

tasks:
  default:
    desc: Показать доступные команды
    cmds:
      - task --list

  setup:
    desc: Проверить macOS/Xcode/Metal/Rust и подключить Git hooks
    cmds:
      - ./scripts/bootstrap-macos.sh
      - |
        if git rev-parse --git-dir >/dev/null 2>&1; then
          git config core.hooksPath .githooks
          echo 'Git hooks подключены из .githooks/'
        fi

  fmt:
    desc: Проверить форматирование Rust
    cmds:
      - cargo fmt --all -- --check

  test:
    desc: Запустить unit-тесты всего Rust workspace
    cmds:
      - cargo test --workspace

  check:
    desc: Проверить весь Rust workspace
    cmds:
      - cargo check --workspace

  lint:
    desc: Запустить Clippy без предупреждений
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  verify:
    desc: Выполнить обязательный pre-commit набор
    cmds:
      - task: fmt
      - task: test
      - task: check
      - task: lint

  harness:
    desc: Запустить headless harness daemon (impetusd) в текущей terminal tab
    cmds:
      - cargo run -p impetusd

  cli:
    desc: 'Вызвать impetus client CLI; пример: task cli -- create'
    cmds:
      - cargo run -p impetus -- {{.CLI_ARGS}}

  ci:list:
    desc: Показать GitLab CI jobs из .gitlab-ci.yml
    cmds:
      - gitlab-ci-local --list-csv-all

  ci:local:
    desc: Выполнить GitLab CI локально trusted shell executor-ом
    cmds:
      - gitlab-ci-local --force-shell-executor --shell-executor-no-image

  security:audit:
    desc: Проверить Cargo.lock по RustSec advisories
    cmds:
      - cargo audit

  security:deny:
    desc: Проверить advisories, лицензии, bans и sources Cargo dependency graph
    cmds:
      - cargo deny check advisories bans sources licenses

  security:
    desc: Выполнить все dependency security checks
    cmds:
      - task: security:audit
      - task: security:deny

  commit:check:
    desc: 'Проверить Git subject (KEY-123 type: Результат)'
    requires:
      vars: [MESSAGE]
    env:
      COMMIT_SUBJECT: '{{.MESSAGE}}'
    cmds:
      - python3 scripts/check-commit-subject.py
