name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PR CI: skip full debuginfo — faster compile, same assertions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  # Offline / non-interactive — never prompt for secrets or Keychain UI.
  CI: "1"
  IMPETUS_NONINTERACTIVE: "1"
  RUST_BACKTRACE: "1"

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      site: ${{ steps.scope.outputs.site }}
      workspace: ${{ steps.scope.outputs.workspace }}
      security: ${{ steps.scope.outputs.security }}
      macos: ${{ steps.scope.outputs.macos }}
      packages: ${{ steps.scope.outputs.packages }}
      check_packages: ${{ steps.scope.outputs.check_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Selector unit tests
        run: |
          set -euo pipefail
          chmod +x scripts/ci-affected.sh scripts/tests/ci-affected.sh
          ./scripts/tests/ci-affected.sh
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "${{ github.base_ref || 'main' }}"
          export BASE_REF="origin/${{ github.base_ref || 'main' }}"
          ./scripts/ci-affected.sh | tee /tmp/scope.txt
          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_OUTPUT"
          done < /tmp/scope.txt

  # Primary Rust quality gate: fmt + clippy + unit/integration on one runner
  # so the compile graph is built once and reused (no check→clippy→test thrash).
  linux:
    name: Linux
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-rust
          cache-targets: "true"
          cache-workspace-crates: "true"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (affected + dependants)
        # Clippy compiles the graph — replaces a separate cargo check.
        run: cargo clippy ${{ needs.detect.outputs.check_packages }} --lib --bins --tests -- -D warnings
      - name: Unit tests (affected lib/bins)
        run: cargo test ${{ needs.detect.outputs.packages }} --lib --bins
      - name: Integration + daemon E2E (affected)
        # crates/*/tests + package integration targets; offline mocks only.
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY ANTHROPIC_API_KEY TAVILY_API_KEY EXA_API_KEY GITHUB_TOKEN GH_TOKEN || true
          cargo test ${{ needs.detect.outputs.packages }} --tests -- --test-threads=2

  # macOS: only when platform-sensitive paths change (Seatbelt/Keychain/PTY/…).
  macos:
    name: macOS
    needs: detect
    if: needs.detect.outputs.rust == 'true' && needs.detect.outputs.macos == 'true'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos-platform
          cache-targets: "true"
          cache-workspace-crates: "true"
      - name: Platform tests (Seatbelt / no-sudo / sandbox)
        env:
          IMPETUS_NONINTERACTIVE: "1"
        run: |
          set -euo pipefail
          # Seatbelt / sandbox (cfg macos inside the crates).
          cargo test -p impetus-core --test macos_sandbox_production --test macos_sandbox_spike --test approval_seatbelt_e2e -- --test-threads=1
          # Userspace no-sudo / no-password path.
          cargo test -p impetusd --test daemon_userspace_no_sudo -- --test-threads=1
          # Peer isolation when the module exists (landed via platform PRs).
          if [[ -f crates/impetusd/src/peer_isolation.rs ]]; then
            cargo test -p impetusd --test daemon_peer_isolation -- --test-threads=1
            cargo test -p impetusd --lib peer_isolation -- --test-threads=1
          fi
          # PTY / sandbox lib filters (single TESTNAME regex).
          cargo test -p impetus-core --lib 'pty|sandbox' -- --test-threads=2

  security:
    name: Security
    needs: detect
    if: needs.detect.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-security
          cache-targets: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories bans sources licenses

  site:
    name: Site
    needs: detect
    if: needs.detect.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
        env:
          GITHUB_ACTIONS: "true"

  # Docs-only / tooling-only: cheap markdown hygiene (no Rust).
  docs:
    name: Docs
    needs: detect
    if: needs.detect.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Diff whitespace check
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD || git diff --check HEAD~1 HEAD || true

  # Aggregator for branch protection: require only this job so skipped
  # scoped jobs (docs-only / no-macos / no-security / no-site) do not block merge.
  gate:
    name: Gate
    if: always()
    needs: [detect, linux, macos, security, site, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful applicable jobs
        shell: bash
        run: |
          set -euo pipefail
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          echo "detect=${{ needs.detect.result }}"
          echo "linux=${{ needs.linux.result }}"
          echo "macos=${{ needs.macos.result }}"
          echo "security=${{ needs.security.result }}"
          echo "site=${{ needs.site.result }}"
          echo "docs=${{ needs.docs.result }}"
          ok "${{ needs.detect.result }}"
          ok "${{ needs.linux.result }}"
          ok "${{ needs.macos.result }}"
          ok "${{ needs.security.result }}"
          ok "${{ needs.site.result }}"
          ok "${{ needs.docs.result }}"
          echo "CI gate passed"
