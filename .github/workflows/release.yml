name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: impetus-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: impetus-macos-aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-release-rust-1.98-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-release-rust-1.98-

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p impetus -p impetus-cli
          strip target/${{ matrix.target }}/release/impetus || true
          strip target/${{ matrix.target }}/release/impetus-cli || true

      - name: Package binaries
        run: |
          mkdir -p dist
          tar czf dist/${{ matrix.artifact_name }}.tar.gz \
            -C target/${{ matrix.target }}/release impetus impetus-cli
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          else
            sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
