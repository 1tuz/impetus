name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: impetus-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: impetus-macos-aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-targets: "false"

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p impetus -p impetusd
          strip target/${{ matrix.target }}/release/impetus || true
          strip target/${{ matrix.target }}/release/impetusd || true

      - name: Package binaries
        run: |
          mkdir -p dist
          tar czf dist/${{ matrix.artifact_name }}.tar.gz \
            -C target/${{ matrix.target }}/release impetus impetusd
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          else
            sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
