<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="impetus-architecture-title impetus-architecture-desc" style="pointer-events:none">
  <title id="impetus-architecture-title">How a request stays controlled in Impetus</title>
  <desc id="impetus-architecture-desc">A client sends a request to the Impetus harness, which checks it before approved work can run, while session history and credential references remain local.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="impetus-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e4a853"/></marker>
    <marker id="impetus-architecture-muted-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8393a2"/></marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#090c10"/>
  <g fill="none" stroke="#536372" stroke-width="1" stroke-dasharray="4 4"><rect x="40" y="88" width="200" height="424" rx="12"/><rect x="280" y="88" width="520" height="424" rx="12"/><rect x="840" y="88" width="320" height="424" rx="12"/></g>
  <g fill="#b6c0ca"><text x="64" y="136" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="28">⌨</text><text x="96" y="132" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" font-weight="600" letter-spacing="1.2">TERMINAL</text><text x="304" y="136" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="28">💻</text><text x="340" y="132" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" font-weight="600" letter-spacing="1.2">YOUR DEVICE</text><text x="864" y="136" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="28">🗄</text><text x="900" y="132" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" font-weight="600" letter-spacing="1.2">LOCAL DATA</text></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M216 304H312" stroke="#e4a853" stroke-width="3" marker-end="url(#impetus-architecture-arrow)"/><path d="M508 304H560" stroke="#e4a853" stroke-width="3" marker-end="url(#impetus-architecture-arrow)"/><path d="M664 352V408" stroke="#e4a853" stroke-width="3" marker-end="url(#impetus-architecture-arrow)"/>
    <path d="M508 288H680Q688 288 688 280V224Q688 216 696 216H872" stroke="#8393a2" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#impetus-architecture-muted-arrow)"/><path d="M768 320H816Q824 320 824 328V384Q824 392 832 392H872" stroke="#8393a2" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#impetus-architecture-muted-arrow)"/>
  </g>
  <g font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="64" y="256" width="152" height="96" rx="8" fill="#141b22" stroke="#536372" stroke-width="2"/><text x="80" y="284" fill="#93a1b0" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">CLIENT</text><text x="80" y="312" fill="#f4f1e9" font-size="16" font-weight="600">Terminal / Zap</text><text x="80" y="336" fill="#b6c0ca" font-size="12">CLI, TUI or agent UI</text>
    <rect x="312" y="256" width="196" height="96" rx="8" fill="#1a2027" stroke="#e4a853" stroke-width="2"/><text x="332" y="284" fill="#e4a853" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">HARNESS</text><text x="332" y="312" fill="#f4f1e9" font-size="16" font-weight="600">All-in-one Impetus</text><text x="332" y="336" fill="#b6c0ca" font-size="12">durable control + local IPC</text>
    <rect x="560" y="256" width="208" height="96" rx="8" fill="#141b22" stroke="#536372" stroke-width="2"/><text x="580" y="284" fill="#93a1b0" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">DECISION</text><text x="580" y="312" fill="#f4f1e9" font-size="16" font-weight="600">Review request</text><text x="580" y="336" fill="#b6c0ca" font-size="12">allow / deny / ask</text>
    <rect x="560" y="408" width="208" height="96" rx="8" fill="#141b22" stroke="#536372" stroke-width="2"/><text x="580" y="436" fill="#93a1b0" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">EXECUTION</text><text x="580" y="464" fill="#f4f1e9" font-size="16" font-weight="600">Run approved task</text><text x="580" y="488" fill="#b6c0ca" font-size="12">sandbox + guard</text>
    <rect x="872" y="168" width="256" height="96" rx="8" fill="#141b22" stroke="#536372" stroke-width="2"/><text x="892" y="196" fill="#93a1b0" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">HISTORY</text><text x="892" y="224" fill="#f4f1e9" font-size="16" font-weight="600">Session history</text><text x="892" y="248" fill="#b6c0ca" font-size="12">SQLite WAL events</text>
    <rect x="872" y="344" width="256" height="96" rx="8" fill="#16191d" stroke="#e4a853" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 6"/><text x="892" y="372" fill="#e4a853" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">CREDENTIALS</text><text x="892" y="400" fill="#f4f1e9" font-size="16" font-weight="600">Credentials stay local</text><text x="892" y="424" fill="#b6c0ca" font-size="12">Keychain reference</text>
  </g>
  <path d="M64 560H1136" stroke="#26313b" stroke-width="2"/>
  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#93a1b0" letter-spacing="0.5"><text x="64" y="596">SOLID = REQUEST PATH</text><text x="304" y="596">DASHED = LOCAL SUPPORT</text><text x="640" y="596">A CLIENT RESTART CAN REPLAY DURABLE EVENTS</text></g>
</svg>
