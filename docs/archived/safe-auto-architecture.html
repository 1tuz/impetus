<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impetus — Safe Auto</title>
  <style>
    :root { --paper:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --rule:#d2d2d7; --accent:#007aff; --tint:#e8f3ff; --warn:#fff4df; --stop:#f1f1f3; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
    main { max-width:1680px; margin:0 auto; padding:32px 28px 44px; }
    h1 { margin:0; font-size:32px; letter-spacing:-.035em; }
    p { color:var(--muted); margin:8px 0 24px; max-width:1120px; line-height:1.45; }
    svg { width:100%; height:auto; display:block; background:var(--paper); pointer-events:none; }
    .zone { fill:rgba(29,29,31,.018); stroke:#c7c7cc; stroke-width:1; stroke-dasharray:4 4; }
    .node { fill:#fff; stroke:#1d1d1f; stroke-width:1.2; }
    .focus { fill:var(--tint); stroke:var(--accent); stroke-width:1.5; }
    .human { fill:var(--warn); stroke:#9a6b16; stroke-width:1.2; }
    .stop { fill:var(--stop); stroke:#6e6e73; stroke-width:1.2; }
    .store { fill:#ededf0; stroke:#6e6e73; stroke-width:1.2; }
    .path { fill:none; stroke:#6e6e73; stroke-width:1.5; marker-end:url(#arrow); }
    .primary { fill:none; stroke:var(--accent); stroke-width:2; marker-end:url(#arrow-accent); }
    .blocked { fill:none; stroke:#6e6e73; stroke-width:1.2; stroke-dasharray:4 4; marker-end:url(#arrow); }
    .event { fill:none; stroke:#8e8e93; stroke-width:1.1; stroke-dasharray:2 5; marker-end:url(#arrow); }
    .name { font-size:16px; font-weight:650; fill:#1d1d1f; }
    .sub { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#6e6e73; }
    .tag { font:8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.16em; fill:#6e6e73; }
    .label { font:8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.06em; fill:#4f4f54; }
  </style>
</head>
<body>
<main>
  <h1>Safe Auto — автономность внутри жёсткой границы</h1>
  <p>Классификатор рассматривает только auto-reviewable action. Hard deny останавливается раньше, human-only остаётся человеку, а timeout или неверный verdict означает block. Сырые результаты инструментов не попадают в safety reviewer.</p>
  <svg viewBox="0 0 1600 1000" role="img" aria-labelledby="safe-auto-title safe-auto-desc">
    <title id="safe-auto-title">Архитектура Safe Auto mode</title>
    <desc id="safe-auto-desc">User intent и типизированный action проходят deterministic policy. Hard deny блокируется, human-only требует человека, safe allow идёт напрямую, а auto-reviewable проверяет отдельный reviewer. После sandbox и execution недоверенный output проходит probe до agent context. Аудит сохраняется без секретов.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e6e73"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#007aff"/></marker>
    </defs>

    <rect class="zone" x="48" y="48" width="1504" height="168" rx="8"/>
    <rect x="72" y="52" width="336" height="16" rx="4" fill="#f5f5f7"/>
    <text class="tag" font-size="8" x="80" y="64">TRUSTED INTENT + IMMUTABLE SNAPSHOT</text>
    <rect class="zone" x="48" y="264" width="1504" height="424" rx="8"/>
    <rect x="72" y="268" width="352" height="16" rx="4" fill="#f5f5f7"/>
    <text class="tag" font-size="8" x="80" y="280">PRE-EXECUTION ENFORCEMENT · FAIL CLOSED</text>
    <rect class="zone" x="48" y="736" width="1504" height="184" rx="8"/>
    <rect x="72" y="740" width="400" height="16" rx="4" fill="#f5f5f7"/>
    <text class="tag" font-size="8" x="80" y="752">SCOPED EFFECT + UNTRUSTED OUTPUT BOUNDARY</text>

    <line class="primary" x1="312" y1="136" x2="376" y2="136"/>
    <rect x="304" y="108" width="80" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="344" y="120" text-anchor="middle">INTENT</text>
    <path class="primary" d="M 516 184 V 248 Q 516 256 508 256 H 250 Q 242 256 242 264 V 344"/>
    <rect x="336" y="228" width="120" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="396" y="240" text-anchor="middle">TYPED ACTION</text>

    <path class="primary" d="M 380 372 H 464"/>
    <rect x="384" y="344" width="80" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="424" y="356" text-anchor="middle">SAFE</text>
    <path class="primary" d="M 704 352 H 1128 Q 1136 352 1136 360 V 424 H 1160"/>
    <rect x="864" y="324" width="96" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="912" y="336" text-anchor="middle">ALLOW</text>

    <path class="primary" d="M 380 416 H 752 Q 760 416 760 408 V 376 H 792"/>
    <rect x="560" y="388" width="160" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="640" y="400" text-anchor="middle">AUTO-REVIEWABLE</text>
    <line class="primary" x1="1072" y1="376" x2="1160" y2="448"/>
    <rect x="1080" y="380" width="96" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="1128" y="392" text-anchor="middle">VERDICT ALLOW</text>

    <path class="path" d="M 380 448 H 424 Q 432 448 432 456 V 528 H 464"/>
    <rect x="384" y="480" width="96" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="432" y="492" text-anchor="middle">HUMAN ONLY</text>
    <path class="primary" d="M 704 528 H 1104 Q 1112 528 1112 496 H 1160"/>
    <rect x="848" y="500" width="112" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="904" y="512" text-anchor="middle">APPROVED</text>

    <path class="blocked" d="M 242 456 V 536"/>
    <rect x="194" y="484" width="96" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="242" y="496" text-anchor="middle">HARD DENY</text>
    <path class="blocked" d="M 932 432 V 624 Q 932 640 916 640 H 380"/>
    <rect x="696" y="612" width="160" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="776" y="624" text-anchor="middle">BLOCK / NO VERDICT</text>

    <path class="primary" d="M 1280 504 V 704 Q 1280 712 1272 712 H 864 Q 856 712 856 736 V 776"/>
    <rect x="1008" y="684" width="128" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="1072" y="696" text-anchor="middle">SCOPED CALL</text>
    <line class="path" x1="720" y1="828" x2="640" y2="828"/>
    <rect x="640" y="800" width="80" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="680" y="812" text-anchor="middle">OUTPUT</text>
    <line class="path" x1="368" y1="828" x2="312" y2="828"/>
    <rect x="304" y="800" width="64" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="336" y="812" text-anchor="middle">CLEAN</text>
    <line class="event" x1="1008" y1="844" x2="1120" y2="844"/>
    <rect x="1024" y="816" width="80" height="16" rx="4" fill="#f5f5f7"/>
    <text class="label" font-size="8" x="1064" y="828" text-anchor="middle">AUDIT</text>

    <g>
      <rect class="node" x="72" y="88" width="240" height="96" rx="8"/>
      <text class="tag" font-size="8" x="96" y="112">USER-OWNED</text>
      <text class="name" font-size="16" x="96" y="144">Intent + boundaries</text>
      <text class="sub" font-size="12" x="96" y="168">exact · revisioned</text>
    </g>
    <g>
      <rect class="node" x="376" y="88" width="280" height="96" rx="8"/>
      <text class="tag" font-size="8" x="400" y="112">RUNTIME SNAPSHOT</text>
      <text class="name" font-size="16" x="400" y="144">Action + scope + env</text>
      <text class="sub" font-size="12" x="400" y="168">normalized · fingerprinted</text>
    </g>
    <g>
      <rect class="focus" x="120" y="344" width="260" height="112" rx="8"/>
      <text class="tag" font-size="8" x="144" y="372">DETERMINISTIC POLICY</text>
      <text class="name" font-size="16" x="144" y="408">First enforcement</text>
      <text class="sub" font-size="12" x="144" y="432">deny · safe · human · review</text>
    </g>
    <g>
      <rect class="node" x="464" y="304" width="240" height="96" rx="8"/>
      <text class="tag" font-size="8" x="488" y="328">SAFE SET</text>
      <text class="name" font-size="16" x="488" y="360">Narrow allow</text>
      <text class="sub" font-size="12" x="488" y="384">read-only · in-scope</text>
    </g>
    <g>
      <rect class="human" x="464" y="472" width="240" height="112" rx="8"/>
      <text class="tag" font-size="8" x="488" y="500">HUMAN GATE</text>
      <text class="name" font-size="16" x="488" y="536">Manual approval</text>
      <text class="sub" font-size="12" x="488" y="560">exact diff · cmd · target</text>
    </g>
    <g>
      <rect class="focus" x="792" y="320" width="280" height="112" rx="8"/>
      <text class="tag" font-size="8" x="816" y="348">SEPARATE REVIEWER</text>
      <text class="name" font-size="16" x="816" y="384">Safety classifier</text>
      <text class="sub" font-size="12" x="816" y="408">typed input · no raw output</text>
    </g>
    <g>
      <rect class="stop" x="120" y="536" width="260" height="96" rx="8"/>
      <text class="tag" font-size="8" x="144" y="560">STOP</text>
      <text class="name" font-size="16" x="144" y="592">Blocked</text>
      <text class="sub" font-size="12" x="144" y="616">effect never starts</text>
    </g>
    <g>
      <rect class="focus" x="1160" y="392" width="280" height="112" rx="8"/>
      <text class="tag" font-size="8" x="1184" y="420">SECOND ENFORCEMENT</text>
      <text class="name" font-size="16" x="1184" y="456">Sandbox + capability</text>
      <text class="sub" font-size="12" x="1184" y="480">scope · limits · freshness</text>
    </g>
    <g>
      <rect class="node" x="72" y="776" width="240" height="104" rx="8"/>
      <text class="tag" font-size="8" x="96" y="804">AGENT CONTEXT</text>
      <text class="name" font-size="16" x="96" y="840">Provenance-aware</text>
      <text class="sub" font-size="12" x="96" y="864">clean / suspicious label</text>
    </g>
    <g>
      <rect class="focus" x="368" y="776" width="272" height="104" rx="8"/>
      <text class="tag" font-size="8" x="392" y="804">UNTRUSTED INPUT</text>
      <text class="name" font-size="16" x="392" y="840">Output probe</text>
      <text class="sub" font-size="12" x="392" y="864">tool · web · file · terminal</text>
    </g>
    <g>
      <rect class="node" x="720" y="776" width="288" height="104" rx="8"/>
      <text class="tag" font-size="8" x="744" y="804">EXECUTION</text>
      <text class="name" font-size="16" x="744" y="840">Typed effect</text>
      <text class="sub" font-size="12" x="744" y="864">one attempt · bounded output</text>
    </g>
    <g>
      <rect class="store" x="1120" y="776" width="320" height="104" rx="8"/>
      <text class="tag" font-size="8" x="1144" y="804">DURABLE AUDIT</text>
      <text class="name" font-size="16" x="1144" y="840">SQLite references</text>
      <text class="sub" font-size="12" x="1144" y="864">versions · hashes · no secrets</text>
    </g>

    <line x1="48" y1="956" x2="1552" y2="956" stroke="#d2d2d7" stroke-width="1"/>
    <text class="tag" font-size="8" x="64" y="980">LEGEND</text>
    <line x1="176" y1="976" x2="224" y2="976" stroke="#007aff" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text class="label" font-size="8" x="240" y="980">ALLOWED PATH</text>
    <line x1="416" y1="976" x2="464" y2="976" stroke="#6e6e73" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text class="label" font-size="8" x="480" y="980">BLOCKED</text>
    <rect x="624" y="968" width="16" height="16" rx="4" fill="#fff4df" stroke="#9a6b16" stroke-width="1"/>
    <text class="label" font-size="8" x="656" y="980">HUMAN ONLY</text>
    <rect x="848" y="968" width="16" height="16" rx="4" fill="#e8f3ff" stroke="#007aff" stroke-width="1"/>
    <text class="label" font-size="8" x="880" y="980">ENFORCEMENT POINT</text>
  </svg>
</main>
</body>
</html>
