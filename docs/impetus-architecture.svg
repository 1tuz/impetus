<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="impetus-architecture-svg-title impetus-architecture-svg-desc">
  <title id="impetus-architecture-svg-title">Impetus architecture</title>
  <desc id="impetus-architecture-svg-desc">Impetus connects local clients to a durable runtime over Unix-socket IPC, applies policy and capability controls before execution, and keeps event state and credential references in separate stores.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap'); .zone{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.12);stroke-width:.8}.zl{fill:#f5f5f5}.zt,.tag,.sub,.legend{fill:#4f5d75;font-family:'Geist Mono',monospace;font-size:8px}.zt{fill:#7a8399;letter-spacing:1.2px}.node{fill:#fff;stroke:#2d3142;stroke-width:1}.input{fill:rgba(79,93,117,.1);stroke:#7a8399}.optional{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.3);stroke-dasharray:4 4}.store{fill:rgba(45,49,66,.05);stroke:#4f5d75}.security{fill:rgba(235,108,54,.05);stroke:rgba(235,108,54,.6);stroke-dasharray:4 4}.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.tb{fill:none;stroke:rgba(45,49,66,.4);stroke-width:.8}.ta{fill:none;stroke:rgba(235,108,54,.6);stroke-width:.8}.name{fill:#2d3142;font-family:Geist,sans-serif;font-size:12px;font-weight:600}.accent{fill:#eb6c36}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f5f5f5"/>
  <rect class="zone" x="24" y="264" width="176" height="264" rx="8"/><rect class="zl" x="40" y="268" width="112" height="16" rx="4"/><text class="zt" x="96" y="280" text-anchor="middle">CLIENT SPACE</text>
  <rect class="zone" x="200" y="264" width="672" height="328" rx="8"/><rect class="zl" x="216" y="268" width="120" height="16" rx="4"/><text class="zt" x="276" y="280" text-anchor="middle">IMPETUS RUNTIME</text>
  <rect class="zone" x="888" y="264" width="224" height="176" rx="8"/><rect class="zl" x="904" y="268" width="120" height="16" rx="4"/><text class="zt" x="964" y="280" text-anchor="middle">CONTROLLED EFFECTS</text>
  <path d="M168,360H224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M168,432H192Q200,432 200,424V384Q200,376 208,376H224" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/><path d="M368,360H432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M608,360H672" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><path d="M848,360H912" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M520,408V488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M760,408V488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <g><rect class="node input" x="48" y="320" width="120" height="80" rx="6"/><rect class="tb" x="56" y="328" width="40" height="16" rx="4"/><text class="tag" x="76" y="340" text-anchor="middle">CLIENT</text><text class="name" x="108" y="364" text-anchor="middle">Local client</text><text class="sub" x="108" y="384" text-anchor="middle">CLI · native app</text></g>
  <g><rect class="node optional" x="48" y="400" width="120" height="80" rx="6"/><rect class="tb" x="56" y="408" width="48" height="16" rx="4"/><text class="tag" x="80" y="420" text-anchor="middle">PLANNED</text><text class="name" x="108" y="444" text-anchor="middle">Zap adapter</text><text class="sub" x="108" y="464" text-anchor="middle">structured client</text></g>
  <g><rect class="node" x="224" y="320" width="144" height="88" rx="6"/><rect class="tb" x="232" y="328" width="32" height="16" rx="4"/><text class="tag" x="248" y="340" text-anchor="middle">IPC</text><text class="name" x="296" y="364" text-anchor="middle">Unix socket</text><text class="sub" x="296" y="384" text-anchor="middle">versioned · typed</text></g>
  <g><rect class="node focal" x="432" y="320" width="176" height="88" rx="6"/><rect class="ta" x="440" y="328" width="56" height="16" rx="4"/><text class="tag accent" x="468" y="340" text-anchor="middle">RUNTIME</text><text class="name" x="520" y="364" text-anchor="middle">Headless harness</text><text class="sub" x="520" y="384" text-anchor="middle">sessions · events · providers</text></g>
  <g><rect class="node focal" x="672" y="320" width="176" height="88" rx="6"/><rect class="ta" x="680" y="328" width="48" height="16" rx="4"/><text class="tag accent" x="704" y="340" text-anchor="middle">GATE</text><text class="name" x="760" y="364" text-anchor="middle">Effect control</text><text class="sub" x="760" y="384" text-anchor="middle">policy · approval · sandbox</text></g>
  <g><rect class="node" x="912" y="320" width="176" height="88" rx="6"/><rect class="tb" x="920" y="328" width="48" height="16" rx="4"/><text class="tag" x="944" y="340" text-anchor="middle">ACTION</text><text class="name" x="1000" y="364" text-anchor="middle">Execution</text><text class="sub" x="1000" y="384" text-anchor="middle">process · PTY · remote</text></g>
  <g><rect class="node store" x="432" y="488" width="176" height="80" rx="6"/><rect class="tb" x="440" y="496" width="40" height="16" rx="4"/><text class="tag" x="460" y="508" text-anchor="middle">STORE</text><text class="name" x="520" y="532" text-anchor="middle">Durable state</text><text class="sub" x="520" y="552" text-anchor="middle">SQLite WAL · redacted events</text></g>
  <g><rect class="node security" x="672" y="488" width="176" height="80" rx="6"/><rect class="ta" x="680" y="496" width="64" height="16" rx="4"/><text class="tag accent" x="712" y="508" text-anchor="middle">SECURITY</text><text class="name" x="760" y="532" text-anchor="middle">macOS Keychain</text><text class="sub" x="760" y="552" text-anchor="middle">credential references only</text></g>
  <line x1="48" y1="620" x2="1152" y2="620" stroke="rgba(45,49,66,.12)" stroke-width=".8"/><text class="legend" x="48" y="652" letter-spacing="1.2">LEGEND</text><line x1="152" y1="648" x2="184" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text class="legend" x="200" y="652">active path</text><line x1="336" y1="648" x2="368" y2="648" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/><text class="legend" x="384" y="652">planned path</text><rect x="552" y="640" width="16" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text class="legend" x="584" y="652">control point</text><a href="https://github.com/cathrynlavery/diagram-design"><text x="1152" y="684" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" text-anchor="end">Diagram by diagram-design</text></a>
</svg>
